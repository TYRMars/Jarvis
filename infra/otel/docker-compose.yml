services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: jarvis-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC (default JARVIS_OTEL_ENDPOINT)
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: jarvis-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI — open http://127.0.0.1:16686
      - "14250:14250" # gRPC accepted from collector
