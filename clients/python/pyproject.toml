[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-client"
version = "0.1.0"
description = "Python client SDK for the Jarvis agent runtime HTTP API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
include = ["jarvis_client*"]
