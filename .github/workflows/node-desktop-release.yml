name: Node Desktop Release (Electron)

# Build the Electron desktop app (@jarvis/desktop, P7.8) into macOS dmg + zip
# artifacts. This is the Node-rewrite successor to the Tauri `desktop-release.yml`
# (which it will replace once Rust is decommissioned — P8.2). It uses a DISTINCT
# `node-desktop-v*` tag so the two release workflows never fire on the same tag
# during the migration.
#
# Builds are UNSIGNED by default. To sign/notarize, add the Apple secrets
# (CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD,
# APPLE_TEAM_ID) and flip `hardenedRuntime` in electron-builder.yml.

on:
  push:
    tags:
      - "node-desktop-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach artifacts to a GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # `pnpm --filter @jarvis/desktop run dist` runs build:web (Vite SPA with
      # JARVIS_DESKTOP_BUILD=1) + bundle (esbuild main/preload) + electron-builder.
      # build:web shells into apps/jarvis-web and `npm install`s its own deps.
      - name: Build + package (dmg + zip)
        run: pnpm --filter @jarvis/desktop run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-desktop-macos-${{ matrix.arch }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/node-desktop-v') || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Jarvis Desktop (Electron) ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
