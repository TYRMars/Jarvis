[package]
name = "harness-project"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Project / Requirement / Run / Activity / Comment / Label / Doc / ProjectMemory value types and persistence trait surface. The 'Work' feature of Jarvis, extracted from harness-core so the agent loop stays focused."

[dependencies]
# `RequirementRun.usage` is a `harness_core::Usage` (LLM token-billing
# record). Depending on harness-core here is the right direction —
# agent-loop types flow downward into application domains, never up —
# and avoids duplicating a wire-shape struct.
harness-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
ts-rs.workspace = true
uuid.workspace = true
