[workspace]
resolver = "2"
members = [
    "crates/harness-channel",
    "crates/harness-cloud",
    "crates/harness-core",
    "crates/harness-llm",
    "crates/harness-mcp",
    "crates/harness-memory",
    "crates/harness-observability",
    "crates/harness-plugin",
    "crates/harness-project",
    "crates/harness-requirement",
    "crates/harness-server",
    "crates/harness-skill",
    "crates/harness-store",
    "crates/harness-subagents",
    "crates/harness-tools",
    "apps/jarvis",
    "apps/jarvis-cli",
    "apps/jarvis-desktop",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
harness-channel = { path = "crates/harness-channel" }
harness-core = { path = "crates/harness-core" }
harness-llm = { path = "crates/harness-llm" }
harness-mcp = { path = "crates/harness-mcp" }
harness-memory = { path = "crates/harness-memory" }
harness-observability = { path = "crates/harness-observability" }
harness-plugin = { path = "crates/harness-plugin" }
harness-project = { path = "crates/harness-project" }
harness-requirement = { path = "crates/harness-requirement" }
harness-server = { path = "crates/harness-server" }
harness-skill = { path = "crates/harness-skill" }
harness-store = { path = "crates/harness-store" }
harness-subagents = { path = "crates/harness-subagents" }
harness-cloud = { path = "crates/harness-cloud" }
harness-tools = { path = "crates/harness-tools" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "process"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.28"
futures = "0.3"
async-stream = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
serde_yaml = "0.9"
rmcp = { version = "1.5", default-features = false, features = ["server", "client", "transport-io", "transport-child-process", "macros"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros"] }
regex = "1"
ignore = "0.4"
diffy = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
include_dir = "0.7"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
dialoguer = "0.11"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
aes = "0.8"
cbc = "0.1"
rand = "0.8"
base64 = "0.22"
# Rust → TypeScript codegen for wire-shape types shared with the
# web frontend. `cargo test --workspace` runs the embedded `export`
# tests `ts-rs` injects for each `#[derive(TS)]` type and writes a
# `.ts` file under `apps/jarvis-web/src/types/generated/`. The
# frontend imports from there instead of hand-maintaining
# duplicates. See `docs/conventions/rust-ts-codegen.md`.
ts-rs = { version = "10", features = ["serde-compat", "no-serde-warnings"] }
open = "5"
tiktoken-rs = "0.6"
libc = "0.2"
portable-pty = "0.9"
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = "2"
rfd = "0.15"
utoipa = { version = "5", features = ["macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
