<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Jarvis 产品架构图</title>
  <desc id="desc">展示 Jarvis 从产品入口、服务控制面、Agent Runtime 到外部集成和执行面的产品架构。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-14%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .text { font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 46px; font-weight: 780; letter-spacing: 0; }
      .subtitle { font-size: 20px; fill: #64748b; }
      .section { font-size: 24px; font-weight: 760; letter-spacing: 0; }
      .card-title { font-size: 20px; font-weight: 730; }
      .body { font-size: 17px; fill: #475569; }
      .small { font-size: 15px; fill: #64748b; }
      .white { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #d8e2ef; stroke-width: 1.4; rx: 24; filter: url(#shadow); }
      .card { fill: #ffffff; stroke: #dbe6f3; stroke-width: 1.2; rx: 16; }
      .soft { fill: #f8fafc; stroke: #dbe6f3; stroke-width: 1.2; rx: 16; }
      .blue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; rx: 16; }
      .green { fill: #ecfdf5; stroke: #bbf7d0; stroke-width: 1.2; rx: 16; }
      .amber { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.2; rx: 16; }
      .purple { fill: #f5f3ff; stroke: #ddd6fe; stroke-width: 1.2; rx: 16; }
      .core-panel { fill: url(#core); rx: 24; filter: url(#shadow); }
      .core-card { fill: #ffffff; fill-opacity: 0.15; stroke: #ffffff; stroke-opacity: 0.28; rx: 16; }
      .flow { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .flow-soft { stroke: #93c5fd; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <text class="text title" x="72" y="78">Jarvis 产品架构</text>
  <text class="text subtitle" x="72" y="116">主路径：入口 -> 服务控制面 -> Agent Runtime -> 模型、工具与执行沙箱。</text>

  <rect class="panel" x="64" y="168" width="260" height="420"/>
  <text class="text section" x="96" y="216">1. 产品入口</text>
  <rect class="card" x="96" y="246" width="196" height="60"/>
  <text class="text card-title" x="120" y="283">Web App</text>
  <rect class="card" x="96" y="326" width="196" height="60"/>
  <text class="text card-title" x="120" y="363">Terminal UI</text>
  <rect class="card" x="96" y="406" width="196" height="60"/>
  <text class="text card-title" x="120" y="443">Desktop Shell</text>
  <rect class="card" x="96" y="486" width="196" height="60"/>
  <text class="text card-title" x="120" y="523">HTTP / SSE / WS</text>

  <rect class="panel" x="394" y="168" width="330" height="420"/>
  <text class="text section" x="428" y="216">2. 服务控制面</text>
  <rect class="blue" x="428" y="246" width="262" height="78"/>
  <text class="text card-title" x="454" y="278">apps/jarvis</text>
  <text class="text body" x="454" y="304">组合根 / 配置 / 生命周期</text>
  <rect class="card" x="428" y="346" width="262" height="78"/>
  <text class="text card-title" x="454" y="378">harness-server</text>
  <text class="text body" x="454" y="404">路由 / WebSocket / 状态</text>
  <rect class="amber" x="428" y="446" width="262" height="78"/>
  <text class="text card-title" x="454" y="478">权限与审批</text>
  <text class="text body" x="454" y="504">规则 / 模式 / HITL 决策</text>

  <rect class="core-panel" x="794" y="156" width="380" height="444"/>
  <text class="text section white" x="834" y="214">3. Agent Runtime</text>
  <text class="text card-title white" x="834" y="256">harness-core</text>
  <text class="text body white" x="834" y="286">Agent loop / Conversation</text>
  <text class="text body white" x="834" y="314">Message / Provider / Tool traits</text>
  <rect class="core-card" x="824" y="354" width="320" height="82"/>
  <text class="text card-title white" x="852" y="386">ToolRegistry</text>
  <text class="text body white" x="852" y="412">工具、MCP、扩展统一入口</text>
  <rect class="core-card" x="824" y="460" width="320" height="82"/>
  <text class="text card-title white" x="852" y="492">harness-memory</text>
  <text class="text body white" x="852" y="518">窗口记忆 / 摘要 / token 预算</text>

  <rect class="panel" x="1250" y="168" width="286" height="420"/>
  <text class="text section" x="1284" y="216">4. 外部集成</text>
  <rect class="purple" x="1284" y="246" width="218" height="76"/>
  <text class="text card-title" x="1308" y="278">LLM Providers</text>
  <text class="text small" x="1308" y="300">OpenAI / Anthropic / Ollama</text>
  <rect class="card" x="1284" y="346" width="218" height="76"/>
  <text class="text card-title" x="1308" y="378">MCP Bridge</text>
  <text class="text small" x="1308" y="400">接入或暴露工具</text>
  <rect class="green" x="1284" y="446" width="218" height="76"/>
  <text class="text card-title" x="1308" y="478">Store</text>
  <text class="text small" x="1308" y="500">SQLite / Postgres / MySQL</text>

  <path class="flow" d="M 324 378 L 394 378"/>
  <path class="flow" d="M 724 378 L 794 378"/>
  <path class="flow" d="M 1174 378 L 1250 378"/>

  <rect class="panel" x="64" y="666" width="1472" height="194"/>
  <text class="text section" x="100" y="718">执行面与能力包</text>
  <rect class="blue" x="100" y="740" width="250" height="76"/>
  <text class="text body" x="126" y="772">ToolRegistry 选择能力</text>
  <text class="text small" x="126" y="796">执行受工作区 / 沙箱限制</text>

  <rect class="soft" x="404" y="724" width="210" height="92"/>
  <text class="text card-title" x="432" y="760">Workspace Tools</text>
  <text class="text small" x="432" y="786">fs / git / shell / http</text>
  <rect class="soft" x="656" y="724" width="210" height="92"/>
  <text class="text card-title" x="684" y="760">Work / Docs</text>
  <text class="text small" x="684" y="786">需求 / 运行 / 文档草稿</text>
  <rect class="soft" x="908" y="724" width="210" height="92"/>
  <text class="text card-title" x="936" y="760">Extensions</text>
  <text class="text small" x="936" y="782">skills / plugins</text>
  <text class="text small" x="936" y="802">subagents</text>
  <rect class="green" x="1160" y="724" width="292" height="92"/>
  <text class="text card-title" x="1188" y="760">Cloud / Edge Sandbox</text>
  <text class="text small" x="1188" y="782">容器 / VM / 隔离 workspace</text>
  <text class="text small" x="1188" y="802">日志 / diff / 产物回传</text>

  <path class="flow-soft" d="M 984 600 L 984 666"/>

  <rect x="80" y="888" width="1440" height="48" rx="14" fill="#ffffff" stroke="#d8e2ef" stroke-width="1.2"/>
  <text class="text small" x="108" y="918">设计规则：</text>
  <text class="text small" x="190" y="918">harness-core 只编排对话、模型与工具调用；HTTP、Provider、存储、MCP、Web UI、云厂商都在外层接入。</text>
</svg>
